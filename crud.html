<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: antiquewhite;
            max-width: 600px;
            margin: 30px;
        }

        div {
            margin: 15px;
        }

        p {
            margin-left: 40px;
            padding-left: 30px;
        }

        input {
            border: 1px solid;
            border-radius: 4px;
        }

        button {
            margin: 5px;
            padding: 10px;
        }

        ul {
            list-style: none;
        }

        li {
            padding: 10px;
        }

        li button:nth-of-type(1):hover {
            background: rgb(126, 239, 149);
        }

        li button:nth-of-type(2):hover {
            background: rgb(230, 108, 108);
        }

        #add {
            background-color: antiquewhite;
            border-style: double;
        }

        #add:hover {
            background-color: bisque;
        }
    </style>

    <script>
        let books = [];

        window.addEventListener("load", function () {
            const title = document.querySelector("#title");
            const author = document.querySelector("#author");
            const category = document.querySelector("#category");
            const price = document.querySelector("#price");
            const year = document.querySelector("#year");
            const add = document.querySelector("#add");
            const list = document.querySelector("#list");
            let editId = null;
            const message = document.querySelector("#message");
            const search = document.querySelector("#search");

            search.addEventListener("input", loading);

            function showMessage(text) {
                message.textContent = text;
            }

            function loading() {
                list.innerHTML = "";

                const searchWord = search.value.trim().toLowerCase();
                const filtering = books.filter(function(b){
                    return String(b.title).toLowerCase().includes(searchWord);
                });

                filtering.forEach(function (book) {
                    const li = document.createElement("li");
                    li.textContent = book.id + " " + book.title + " " + book.author + " " + book.category + " " + book.price + " " + book.year;

                    const edtBtn = document.createElement("button");
                    edtBtn.textContent = "수정";

                    edtBtn.addEventListener("click", function () {
                        title.value = book.title;
                        author.value = book.author;
                        category.value = book.category;
                        price.value = book.price;
                        year.value = book.year;
                        editId = book.id;
                        add.textContent = "저장";
                    });

                    const dltBtn = document.createElement("button");
                    dltBtn.textContent = "삭제";

                    dltBtn.addEventListener("click", async function () {
                        if (confirm("삭제?")) {
                            try {
                                await dltBook(book.id);

                                if (editId === book.id) {
                                    editId = null;
                                    add.textContent = "[Add]";
                                    title.value = author.value = category.value = price.value = year.value = "";
                                }
                            } catch (error) {
                                console.error(error);
                                showMessage("failed. (" + error.message + ")");
                            }
                        }
                    });

                    li.appendChild(edtBtn);
                    li.appendChild(dltBtn);
                    list.appendChild(li);
                });
            }

            async function loadBooks() {
                try {
                    const response = await fetch(`https://6ae2ab38bbb54129229a3818.mockapi.io/books`);

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    books = await response.json();
                    loading();
                } catch (error) {
                    console.error(error);
                    showMessage("failed. (" + error.message + ")");

                }
            }
            loadBooks(); //loading();

            async function addBooks(book) {
                const response = await fetch(`https://6ae2ab38bbb54129229a3818.mockapi.io/books`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(book)
                });
                if (!response.ok) {
                    throw new Error(`HTTP${response.status}`)
                }
                await loadBooks();
            }
            async function dltBook(id) {
                const response = await fetch(`https://6ae2ab38bbb54129229a3818.mockapi.io/books/${id}`,
                    {
                        method: "DELETE" //AI used
                    });

                if (!response.ok) {
                    throw new Error(`HTTP${response.status}`);
                }
                await loadBooks();
            }

            async function editBook(id, book) {
                const response = await fetch(`https://6ae2ab38bbb54129229a3818.mockapi.io/books/${id}`,
                    {
                        method: "PUT", //AI used point
                        //PATCH 로 하니까 안됐음
                        //추가적으로 PUT 으로 하니까 EDIT 시 오류는 없는데 반영이 안되는 문제 발생
                        //headers 추가하니까 작동됨 (서버가 JSON 으로 인식하지 못하고 반영을 못하고 있었음))
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(book)
                    });

                if (!response.ok) {
                    throw new Error(`HTTP${response.status}`);
                }
                await loadBooks();
            }

            function validation() {
                if (title.value.trim() == "") {
                    alert("제목입력");
                    title.focus();
                    return false;
                }

                if (author.value.trim() == "") {
                    alert("저자입력");
                    author.focus();
                    return false;
                }

                if (author.value.trim().length < 2) {
                    alert("저자 : 2자 이상 입력");
                    author.focus();
                    return false;
                }


                if (category.value.trim() == "") {
                    alert("분류입력");
                    category.focus();
                    return false;
                }
                if (price.value.trim() == "" || Number(price.value) < 1 || isNaN(price.value)) {
                    alert("가격은 1 이상 숫자로 입력");
                    price.focus();
                    return false;
                }
                if (year.value.trim() == "" || Number(year.value) < 1900 || Number(year.value) > 2026 || isNaN(year.value)) {
                    alert("연도는 1900 ~ 2026 사이 숫자로 입력");
                    year.focus();
                    return false;
                }

                return true;
            }

            add.addEventListener("click", async function () {
                if (!validation()) return;

                try {
                    if (editId == null) {
                        await addBooks({
                            title: title.value.trim(),
                            author: author.value.trim(),
                            category: category.value.trim(),
                            price: Number(price.value),
                            year: Number(year.value)
                        });
                    } else {
                        await editBook(editId, {
                            title: title.value.trim(),
                            author: author.value.trim(),
                            category: category.value.trim(),
                            price: Number(price.value),
                            year: Number(year.value)
                        })
                        editId = null;
                        add.textContent = "[Add]";
                    }
                    title.value = author.value = category.value = price.value = year.value = "";

                } catch (error) {
                    console.error(error);
                    showMessage("failed. (" + error.message + ")");

                }
            });
        });



    </script>
</head>

<body>
    <h1> book management </h1>
    <div> 제목
        <input type="text" id="title">
    </div>
    <div> 저자
        <input type="text" id="author">
    </div>
    <div> 분류
        <input type="text" id="category">
    </div>
    <div> 가격
        <input type="text" id="price">
    </div>
    <div> 연도
        <input type="text" id="year">
    </div>

    <button id="add"> [Add] </button>
    <p id="message"></p>

    <div> search
        <input type="text" id="search" placeholder="title">
    </div>

    <p> ID 제목 저자 분류 가격 연도 </p>

    <ul id="list"> </ul>
</body>

</html>
